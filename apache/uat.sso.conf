# Apache vhosts — SSO MOBO (paths /auth y /admin)
# Host preferido: sso.mobo.com.mx  (requiere DNS → 192.168.10.150)
# Mientras tanto auth.sso / admin.sso sirven los mismos paths (sin redirect externo).

# Host unificado (usar cuando DNS sso.mobo.com.mx → este servidor)
<VirtualHost *:80>
    ServerName sso.mobo.com.mx
    ServerAlias sso.mobo.com.mx
    ErrorLog /var/www/html/uat.sso/logs/sso-error.log
    CustomLog /var/www/html/uat.sso/logs/sso-access.log combined

    ProxyPreserveHost On
    SetEnvIf Remote_Addr "^(.+)$" CLIENT_REMOTE_ADDR=$1
    RequestHeader set X-Forwarded-For "%{CLIENT_REMOTE_ADDR}e"
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"
    Header always set Strict-Transport-Security "max-age=0"

    ProxyPass /auth http://127.0.0.1:8089/auth
    ProxyPassReverse /auth http://127.0.0.1:8089/auth

    ProxyPass /admin http://127.0.0.1:3010/admin
    ProxyPassReverse /admin http://127.0.0.1:3010/admin

    RedirectMatch ^/$ /admin/
    ProxyTimeout 300
</VirtualHost>

# Keycloak en auth.* (mismo path /auth; NO redirigir a sso.* hasta que DNS apunte aquí)
<VirtualHost *:80>
    ServerName auth.sso.mobo.com.mx
    ServerAlias auth.sso.mobo.com.mx auth.uat.sso.mobo.com.mx
    ErrorLog /var/www/html/uat.sso/logs/auth-error.log
    CustomLog /var/www/html/uat.sso/logs/auth-access.log combined

    ProxyPreserveHost On
    SetEnvIf Remote_Addr "^(.+)$" CLIENT_REMOTE_ADDR=$1
    RequestHeader set X-Forwarded-For "%{CLIENT_REMOTE_ADDR}e"
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"
    Header always set Strict-Transport-Security "max-age=0"

    ProxyPass /auth http://127.0.0.1:8089/auth
    ProxyPassReverse /auth http://127.0.0.1:8089/auth

    # Compat: URLs antiguas sin /auth
    ProxyPass /realms http://127.0.0.1:8089/auth/realms
    ProxyPassReverse /realms http://127.0.0.1:8089/auth/realms
    ProxyPass /resources http://127.0.0.1:8089/auth/resources
    ProxyPassReverse /resources http://127.0.0.1:8089/auth/resources

    RedirectMatch ^/$ /auth/
    ProxyTimeout 300
</VirtualHost>

# Consola en admin.* (path /admin)
<VirtualHost *:80>
    ServerName admin.sso.mobo.com.mx
    ServerAlias admin.sso.mobo.com.mx admin.uat.sso.mobo.com.mx
    ErrorLog /var/www/html/uat.sso/logs/admin-error.log
    CustomLog /var/www/html/uat.sso/logs/admin-access.log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    ProxyPass /admin http://127.0.0.1:3010/admin
    ProxyPassReverse /admin http://127.0.0.1:3010/admin

    # Compat: rutas antiguas sin prefijo /admin
    ProxyPass / http://127.0.0.1:3010/admin/
    ProxyPassReverse / http://127.0.0.1:3010/admin/

    ProxyTimeout 300
</VirtualHost>
